<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Endpoint - Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">
                <i class="fas fa-flask"></i> Test API Endpoint Absensi
            </h1>
            
            <p class="text-gray-600 mb-6">Simulasi request dari ESP32 ke API</p>
            
            <!-- Form Test -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    UID Kartu RFID:
                </label>
                <select id="uid_kartu" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-2">
                    <option value="">-- Pilih Santri --</option>
                    <option value="A1B2C3D4">A1B2C3D4 - Ahmad Fauzi</option>
                    <option value="E5F6G7H8">E5F6G7H8 - Fatimah Zahra</option>
                    <option value="I9J0K1L2">I9J0K1L2 - Muhammad Rizki</option>
                    <option value="M3N4O5P6">M3N4O5P6 - Aisyah Nur</option>
                    <option value="Q7R8S9T0">Q7R8S9T0 - Umar Abdullah</option>
                </select>
                
                <p class="text-sm text-gray-500 mb-4">Atau masukkan UID custom:</p>
                <input type="text" id="custom_uid" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4" placeholder="Contoh: TEST1234">
                
                <button onclick="testAPI()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">
                    🚀 Kirim Request (POST)
                </button>
            </div>
            
            <!-- Endpoint Info -->
            <div class="bg-gray-50 p-4 rounded-lg mb-6">
                <h3 class="font-semibold mb-2">Endpoint:</h3>
                <code class="text-sm bg-gray-800 text-green-400 p-2 rounded block" id="endpoint_url">
                    POST http://localhost/cc/api/absen.php
                </code>
                <p class="text-xs text-gray-600 mt-2">Parameter: uid_kartu</p>
            </div>
            
            <!-- Response -->
            <div id="response" class="hidden">
                <h3 class="font-semibold mb-2">Response:</h3>
                <div id="response_content" class="bg-gray-900 text-green-400 p-4 rounded-lg overflow-auto max-h-96">
                </div>
            </div>
            
            <!-- Loading -->
            <div id="loading" class="hidden text-center py-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="text-gray-600 mt-2">Mengirim request...</p>
            </div>
        </div>
        
        <!-- Log History -->
        <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
            <h2 class="text-xl font-bold mb-4">📜 Request History</h2>
            <div id="history" class="space-y-2">
                <p class="text-gray-500 text-sm">Belum ada request</p>
            </div>
        </div>
    </div>
    
    <script>
        // Update endpoint URL
        const baseUrl = window.location.origin + window.location.pathname.replace('test_api.html', '');
        document.getElementById('endpoint_url').textContent = 'POST ' + baseUrl + 'api/absen.php';
        
        let historyItems = [];
        
        async function testAPI() {
            const select = document.getElementById('uid_kartu');
            const customInput = document.getElementById('custom_uid');
            const uid = customInput.value.trim() || select.value;
            
            if (!uid) {
                alert('Pilih santri atau masukkan UID!');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('response').classList.add('hidden');
            
            try {
                const formData = new FormData();
                formData.append('uid_kartu', uid);
                
                const startTime = Date.now();
                const response = await fetch('api/absen.php', {
                    method: 'POST',
                    body: formData
                });
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                const data = await response.json();
                
                // Show response
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('response').classList.remove('hidden');
                document.getElementById('response_content').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>' +
                    '<p class="text-yellow-400 text-xs mt-2">Response time: ' + duration + 'ms | Status: ' + response.status + '</p>';
                
                // Add to history
                addToHistory(uid, data.status, duration);
                
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('response').classList.remove('hidden');
                document.getElementById('response_content').innerHTML = 
                    '<pre class="text-red-400">ERROR: ' + error.message + '</pre>';
                addToHistory(uid, 'error', 0);
            }
        }
        
        function addToHistory(uid, status, duration) {
            const now = new Date().toLocaleTimeString('id-ID');
            const statusClass = status === 'sukses' ? 'text-green-600' : 
                               status === 'sudah_absen' ? 'text-yellow-600' : 'text-red-600';
            
            const historyDiv = document.getElementById('history');
            const item = document.createElement('div');
            item.className = 'p-3 bg-gray-50 rounded border-l-4 border-blue-500';
            item.innerHTML = `
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-mono text-sm">${uid}</span>
                        <span class="ml-3 ${statusClass} font-semibold">${status}</span>
                    </div>
                    <div class="text-xs text-gray-500">
                        ${now} (${duration}ms)
                    </div>
                </div>
            `;
            
            if (historyDiv.querySelector('p')) {
                historyDiv.innerHTML = '';
            }
            
            historyDiv.insertBefore(item, historyDiv.firstChild);
            
            // Keep only last 10
            while (historyDiv.children.length > 10) {
                historyDiv.removeChild(historyDiv.lastChild);
            }
        }
        
        // Auto-fill custom input when select changes
        document.getElementById('uid_kartu').addEventListener('change', function() {
            if (this.value) {
                document.getElementById('custom_uid').value = '';
            }
        });
        
        document.getElementById('custom_uid').addEventListener('input', function() {
            if (this.value) {
                document.getElementById('uid_kartu').value = '';
            }
        });
    </script>
</body>
</html>
